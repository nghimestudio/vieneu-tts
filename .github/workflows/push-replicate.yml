name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Replicate model owner/name (e.g. nghimestudio/vieneu-tts)"
        required: true
        default: "nghimestudio/vieneu-tts"

jobs:
  push_to_replicate:
    name: Push to Replicate
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
          # Default action pin (v0.9.8) panics on CUDA 12.4 + torch 2.8
          cog-version: v0.16.12

      - name: Push to Replicate
        run: cog push "r8.im/${{ inputs.model_name }}"
